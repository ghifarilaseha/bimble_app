<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riwayat Latihan</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/gaya.css">
</head>
<body>

<header class="kepala">
  <div class="isi">
    <a href="index.html" class="tombol mungil" title="Kembali ke beranda">Beranda</a>
    <span class="judul">Riwayat latihanku</span>
  </div>
</header>

<main class="bungkus">

  <section id="layarPesan" hidden></section>

  <section id="layarCari">
    <h1>Siapa kamu?</h1>
    <p class="samar">
      Tidak ada login di sini. Pilih kelas dan namamu, lalu semua latihan yang
      pernah kamu kumpulkan akan ditampilkan.
    </p>
    <div class="kartu">
      <div class="kolom">
        <label for="pilihKelas">Kelas</label>
        <select id="pilihKelas"></select>
      </div>
      <div class="kolom">
        <label for="pilihNama">Nama</label>
        <select id="pilihNama"></select>
      </div>
      <div class="kolom" id="kolomNamaLain" hidden>
        <label for="isiNama">Tulis namamu persis seperti saat mengerjakan</label>
        <input type="text" id="isiNama" autocomplete="off" autocapitalize="words"
               spellcheck="false" placeholder="Nama lengkap">
      </div>
      <button type="button" class="tombol utama lebar" id="tombolCari">Lihat riwayatku</button>
    </div>
  </section>

  <section id="layarDaftar" hidden>
    <div class="kartu tengah">
      <p class="kecil samar rapat" id="daftarJudul"></p>
      <p class="nilai-besar" id="daftarRerata">0</p>
      <p class="samar" id="daftarRincian"></p>
    </div>
    <div id="daftarPengerjaan"></div>
    <div class="deret" style="margin:1rem 0">
      <button type="button" class="tombol" id="tombolGanti">Bukan saya</button>
      <a class="tombol" href="index.html">Beranda</a>
    </div>
  </section>

  <section id="layarRinci" hidden>
    <div class="deret" style="margin-bottom:1rem">
      <button type="button" class="tombol" id="tombolKembali">Kembali ke daftar</button>
    </div>
    <div id="rinciKepala"></div>
    <div id="rinciSoal"></div>
  </section>

</main>

<script src="vendor/katex/katex.min.js"></script>
<script src="js/konfig.js"></script>
<script src="js/kunci.js"></script>
<script src="js/identitas.js"></script>
<script src="js/rumus.js"></script>
<script src="js/riwayat.js"></script>
</body>
</html>
